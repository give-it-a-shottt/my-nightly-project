services:
  postgres:
    image: postgres:16-alpine
    container_name: nightly-postgres
    restart: always
    environment:
      POSTGRES_USER: nightly_user
      POSTGRES_PASSWORD: nightly_password
      POSTGRES_DB: nightly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
